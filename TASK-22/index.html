<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailwind Hero Landing Page</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans">

  <nav class="sticky top-0 z-50 bg-white shadow flex justify-between items-center px-8 py-4">
    <h1 class="text-xl font-bold">Project</h1>
    <ul class="flex gap-6 text-gray-600 items-center">
      <li class="hover:text-black cursor-pointer">Product</li>
      <li class="hover:text-black cursor-pointer">Solutions</li>
      <li class="hover:text-black cursor-pointer">Resources</li>
      <li class="hover:text-black cursor-pointer">Pricing</li>
      <li class="hover:text-black cursor-pointer">Log in</li>
    </ul>
    <button class="bg-black text-white px-5 py-2 rounded-lg hover:bg-gray-800">Get AI free</button>
  </nav>

  <section class="bg-gradient-to-b from-orange-100 to-white text-center py-20">
    <h1 class="text-5xl font-bold">Write, plan, share.<br/>With AI at your side.</h1>
    <p class="text-gray-600 mt-4 max-w-xl mx-auto">
      A modern workspace that helps teams collaborate and boost productivity.
    </p>

    <div class="flex justify-center gap-4 mt-8">
      <button class="bg-black text-white px-6 py-3 rounded-lg">Get AI free →</button>
      <button class="border px-6 py-3 rounded-lg">Request a demo</button>
    </div>

    <div class="relative mt-16 h-[450px]">
      <img src="1_R1Lp_7Axmf6ARksW_bfTGg.png" alt="Dashboard" class="mx-auto h-full object-cover rounded-lg shadow-lg" />

      <div class="absolute top-10 left-10 bg-white px-4 py-2 shadow rounded">✔ Tasks done</div>
      <div class="absolute top-16 right-10 bg-white px-4 py-2 shadow rounded">✔ On Track</div>
      <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 bg-white px-4 py-2 shadow rounded">👥 Online</div>
    </div>
  </section>

  <div class="fixed bottom-6 right-6">
    <button class="bg-black text-white p-4 rounded-full">💬</button>
  </div>

</body>
</html>
